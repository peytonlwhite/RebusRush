name: iOS build check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Compile Release for iPhone
        run: |
          set -o pipefail
          xcodebuild build -project PuzzleTime.xcodeproj -scheme PuzzleTime \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device-build" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/device-build.log"
      - name: Compile regression tests without launching the app
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project PuzzleTime.xcodeproj -scheme PuzzleTime \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/simulator-build" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/simulator-build.log"
      - name: Run gameplay regression tests
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test-without-building -project PuzzleTime.xcodeproj -scheme PuzzleTime \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/simulator-build" \
            -only-testing:PuzzleTimeTests CODE_SIGNING_ALLOWED=NO
